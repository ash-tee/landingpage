<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Base</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link href="https://fonts.cdnfonts.com/css/poppins" rel="stylesheet">
               
            
</head>
<body>

  <!-- HEADER - header bar -->

  <header class="site-header">

    <!-- navigation inside HEADER - MENUS-->

    
    <nav class="navbar">
        <a href="#home" class="logo-text">CODE BASE</a>
            <ul class="nav-menu-links">
                <li class="t"><a href="#home" class="nav-link od">Home</a></li>
                <li class="t"><a href="#about" class="nav-link od">About</a></li>
                <li class="t"><a href="#services" class="nav-link od">Services</a></li>
                <li class="t"><a href="#login" class="nav-link btn-header-login">Login</a></li>
            </ul>
     
        </nav>     
  </header>

<!-- LOGIN/register BOX - main- IN CENTRE -->
<main class="cover-box">
<section class="grid1">
<form action="#" method="post">
    <h4 class="register-title">Login</h4>
    <div class="input-box-login">   
             <span class="icon"><ion-icon name="mail-outline"></ion-icon></span>
             <input type="email" placeholder="Email" required>
    </div>

    <div class="input-box-login">   
            <span class="icon"><ion-icon name="lock-open-outline"></ion-icon></span>
            <input type="password" placeholder="Password" required>
    </div>

    <div class="remember-forgot"> 
            <label> <input type="checkbox" id="remember-login"> Remember me</label>
            <a href="#"> Forgot Password?</a>
    </div>

    <button type="submit" class="login-btn">Login</button>

    <div class="login-register">
            <p>Don't have an account? <a href="#" class="register-link">Register</a></p>
    </div>
       
</form>
</section>       

 


<section class="grid2">
<form action="#" method="post">
    <h4 class="register-title">Register</h4>

    <div class="input-box-register">   
             <span class="icon"><ion-icon name="person-outline"></ion-icon></span>
             <input type="text" placeholder="Username" required>
    </div>

    <div class="input-box-register">   
             <span class="icon"><ion-icon name="mail-outline"></ion-icon></span>
             <input type="email" placeholder="Email" required>
    </div>

    <div class="input-box-register">   
            <span class="icon"><ion-icon name="lock-open-outline"></ion-icon></span>
            <input type="password" placeholder="Password" required>
    </div>

    <div class="remember-forgot"> 
            <label> <input type="checkbox" id="remember-register"> Remember me</label>
            
    </div>
    <button type="submit" class="login-btn">Register</button>

    <div class="login-register">
            <p>Already have an account? <a href="#" class="login-link">Login</a></p>
    </div>        
</form>
    
</section>
</main>

   






  
 
<!--FOOTER -->


<footer class="site-footer">
    <div class="footer-content">
        <p>&copy; 2024 Code Base. All rights reserved.</p>
        <p><ul class="social-links">
            <li><a href="#"><i class="fab fa-facebook-f"></i></a></li>
            <li><a href="#"><i class="fab fa-instagram"></i></a></li>
            <li><a href="#"><i class="fab fa-linkedin-in"></i></a></li>
        </ul></p>
    </div>


<script src="script.js"></script>   
<script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>
</html>
